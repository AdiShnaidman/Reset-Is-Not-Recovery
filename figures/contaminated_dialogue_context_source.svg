<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="Contaminated dialogue context schematic">
  <title>Contaminated dialogue context schematic</title>
  <style>
    text { font-family: Arial, sans-serif; fill: #111827; }
    .box { fill: #ffffff; stroke: #111827; stroke-width: 2; rx: 6; }
    .soft { fill: #f3f4f6; stroke: #374151; stroke-width: 1.5; rx: 6; }
    .bad { fill: #fee2e2; stroke: #991b1b; stroke-width: 2; rx: 6; }
    .good { fill: #dcfce7; stroke: #166534; stroke-width: 2; rx: 6; }
    .arrow { stroke: #111827; stroke-width: 2; marker-end: url(#arrow); fill: none; }
    .small { font-size: 15px; }
    .label { font-size: 18px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <text x="40" y="45" class="label">Reset Is Not Recovery: contaminated dialogue context</text>
  <rect x="55" y="90" width="220" height="95" class="soft"/>
  <text x="75" y="123" class="label">Clean question</text>
  <text x="75" y="153" class="small">Model scores displayed options</text>
  <text x="75" y="174" class="small">from factual context only</text>
  <path d="M 275 137 C 330 137 330 137 385 137" class="arrow"/>
  <rect x="385" y="90" width="220" height="95" class="bad"/>
  <text x="405" y="123" class="label">Pressure history</text>
  <text x="405" y="153" class="small">User advocates a wrong answer</text>
  <text x="405" y="174" class="small">with increasing confidence</text>
  <path d="M 605 137 C 660 137 660 137 715 137" class="arrow"/>
  <rect x="715" y="90" width="130" height="95" class="box"/>
  <text x="735" y="125" class="label">R0 reset</text>
  <text x="735" y="155" class="small">same history</text>
  <text x="735" y="176" class="small">new prompt</text>
  <rect x="105" y="280" width="220" height="105" class="bad"/>
  <text x="125" y="315" class="label">Ordinary reset</text>
  <text x="125" y="345" class="small">Often retains pressure signal</text>
  <text x="125" y="366" class="small">and follows advocated wrong</text>
  <rect x="390" y="280" width="220" height="105" class="good"/>
  <text x="410" y="315" class="label">Context repair</text>
  <text x="410" y="345" class="small">Deleting or reconstructing state</text>
  <text x="410" y="366" class="small">restores clean-like behavior</text>
  <rect x="675" y="280" width="170" height="105" class="good"/>
  <text x="695" y="315" class="label">Trusted evidence</text>
  <text x="695" y="345" class="small">Grounds recovery</text>
  <text x="695" y="366" class="small">in item facts</text>
</svg>
